
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Steps</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fffaf2;
      color: #333;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }
    h1 { color: #39796b; }
    .activity {
      background: white;
      padding: 15px;
      margin: 12px 0;
      border-radius: 12px;
      border: 1px solid #dce9e4;
    }
    .category { color: #39796b; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Welcome to Little Steps</h1>
  <p>Small steps. Big progress.</p>

  <h2>Our Learning Activities</h2>
  <div id="activities">Loading activities...</div>

  <script>
    const SUPABASE_URL =
      'https://tvovpclxrfssumlvyokc.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_etn4SXS8fDANFOUUcmjYdA_VgLSlkCK';

    async function loadActivities() {
      const container = document.getElementById('activities');

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/activities?select=id,title,description,category&order=created_at.asc`,
          {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }

        const activities = await response.json();

        if (activities.length === 0) {
          container.textContent = 'No activities found yet.';
          return;
        }

        container.replaceChildren();

        activities.forEach(activity => {
          const card = document.createElement('div');
          card.className = 'activity';

          const title = document.createElement('h3');
          title.textContent = activity.title || 'Learning activity';
          card.appendChild(title);

          if (activity.description) {
            const description = document.createElement('p');
            description.textContent = activity.description;
            card.appendChild(description);
          }

          if (activity.category) {
            const category = document.createElement('p');
            category.className = 'category';
            category.textContent = activity.category;
            card.appendChild(category);
          }

          container.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        container.textContent =
          'We could not load activities. Please try again later.';
      }
    }

    loadActivities();
  </script>

<section id="lsLetterGame" style="padding:20px; margin:20px 0; background:#fff4d6; border-radius:16px; text-align:center; font-family:Arial,sans-serif;">
  <h2>🔤 Letter Matching</h2>
  <p>Find the letter that matches!</p>
  <div id="lsTarget" style="font-size:64px; font-weight:bold; color:#2457a7; margin:20px;">A</div>
  <div style="display:flex; justify-content:center; gap:12px; flex-wrap:wrap;">
    <button onclick="lsCheckLetter('B')" style="font-size:28px; padding:15px 24px; border-radius:12px; background:white;">B</button>
    <button onclick="lsCheckLetter('A')" style="font-size:28px; padding:15px 24px; border-radius:12px; background:white;">A</button>
    <button onclick="lsCheckLetter('C')" style="font-size:28px; padding:15px 24px; border-radius:12px; background:white;">C</button>
  </div>
  <p id="lsFeedback" aria-live="polite" style="font-size:20px; font-weight:bold;"></p>
  <button onclick="lsNextLetter()" style="font-size:18px; padding:12px 20px; border:0; border-radius:10px; background:#2457a7; color:white;">Next Letter ➜</button>
</section>

<script>
let lsCurrentLetter = 'A';
let lsLetterIndex = 0;
const lsLetters = ['A', 'B', 'C', 'D', 'E'];

function lsCheckLetter(letter) {
  const feedback = document.getElementById('lsFeedback');
  if (letter === lsCurrentLetter) {
    feedback.textContent = '🌟 Well done! Correct!';
    feedback.style.color = 'green';
  } else {
    feedback.textContent = '😊 Try again!';
    feedback.style.color = '#b45309';
  }
}

function lsNextLetter() {
  lsLetterIndex = (lsLetterIndex + 1) % lsLetters.length;
  lsCurrentLetter = lsLetters[lsLetterIndex];
  document.getElementById('lsTarget').textContent = lsCurrentLetter;
  document.getElementById('lsFeedback').textContent = '';
  const choices = ['A', 'B', 'C', 'D', 'E'];
  const shuffled = choices.sort(() => Math.random() - 0.5).slice(0, 3);
  if (!shuffled.includes(lsCurrentLetter)) {
    shuffled[0] = lsCurrentLetter;
  }
  shuffled.sort(() => Math.random() - 0.5);
  const buttons = document.querySelectorAll('#lsLetterGame div button');
  buttons.forEach((button, index) => {
    button.textContent = shuffled[index];
    button.setAttribute('onclick', "lsCheckLetter('" + shuffled[index] + "')");
  });
}
</script>

</body>
</html>
