
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Little Steps</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fffaf2;
      color: #333;
      padding: 20px;
      max-width: 700px;
      margin: auto;
    }
    h1 { color: #39796b; }
    .activity {
      background: white;
      padding: 15px;
      margin: 12px 0;
      border-radius: 12px;
      border: 1px solid #dce9e4;
    }
    .category { color: #39796b; font-size: 14px; }
  </style>
</head>
<body>
  <h1>Welcome to Little Steps</h1>
  <p>Small steps. Big progress.</p>

  <h2>Our Learning Activities</h2>
  <div id="activities">Loading activities...</div>

  <script>
    const SUPABASE_URL =
      'https://tvovpclxrfssumlvyokc.supabase.co';

    const SUPABASE_KEY =
      'sb_publishable_etn4SXS8fDANFOUUcmjYdA_VgLSlkCK';

    async function loadActivities() {
      const container = document.getElementById('activities');

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/activities?select=id,title,description,category&order=created_at.asc`,
          {
            headers: {
              'apikey': SUPABASE_KEY,
              'Authorization': `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        if (!response.ok) {
          throw new Error(`Request failed: ${response.status}`);
        }

        const activities = await response.json();

        if (activities.length === 0) {
          container.textContent = 'No activities found yet.';
          return;
        }

        container.replaceChildren();

        activities.forEach(activity => {
          const card = document.createElement('div');
          card.className = 'activity';

          const title = document.createElement('h3');
          title.textContent = activity.title || 'Learning activity';
          card.appendChild(title);

          if (activity.description) {
            const description = document.createElement('p');
            description.textContent = activity.description;
            card.appendChild(description);
          }

          if (activity.category) {
            const category = document.createElement('p');
            category.className = 'category';
            category.textContent = activity.category;
            card.appendChild(category);
          }

          container.appendChild(card);
        });
      } catch (error) {
        console.error(error);
        container.textContent =
          'We could not load activities. Please try again later.';
      }
    }

    loadActivities();
  </script>
</body>
</html>
